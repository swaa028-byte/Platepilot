services:
  - type: web
    name: platepilot-web
    runtime: node
    plan: starter
    buildCommand: corepack enable && corepack prepare pnpm@12.21.0 --activate && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: APP_URL
        sync: false
  - type: worker
    name: platepilot-worker
    runtime: node
    plan: starter
    buildCommand: corepack enable && corepack prepare pnpm@12.21.0 --activate && pnpm install --frozen-lockfile
    startCommand: pnpm worker
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WORKER_POLL_MS
        value: "1000"
