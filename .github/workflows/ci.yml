name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:db
      - run: pnpm build
      # The desktop project runs Chromium and the mobile project runs WebKit, so
      # both engines are installed and the end-to-end suite covers both.
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
