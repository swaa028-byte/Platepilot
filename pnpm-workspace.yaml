# Install the optional binaries for the host running the install and for Linux,
# because the production deployment builds on Linux. Pinning this to win32
# stopped pnpm from fetching @next/swc-linux-x64-gnu, and a Linux build then
# fails on a missing native binary.
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - x64
# pnpm fails an install outright when a dependency's build script was skipped
# without saying so (ERR_PNPM_IGNORED_BUILDS). These three ask to run scripts,
# and an unconfigured install exits 1 - which is what the first Netlify build
# died on. Naming them is the approved way to settle the question.
minimumReleaseAgeExclude:
  - '@supabase/auth-js@2.119.1'
  - '@supabase/functions-js@2.119.1'
  - '@supabase/postgrest-js@2.119.1'
  - '@supabase/realtime-js@2.119.1'
  - '@supabase/storage-js@2.119.1'
  - '@supabase/supabase-js@2.119.1'
  - '@testing-library/jest-dom@8.0.0'
  - lucide-react@1.76.0
  - stripe@23.2.0
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
